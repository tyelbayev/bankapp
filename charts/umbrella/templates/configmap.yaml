apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kafka.fullname" . }}-config
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
data:
  server.properties: |
    process.roles=broker,controller
    node.id=${KAFKA_NODE_ID}
    controller.listener.names=CONTROLLER
    listeners=INTERNAL://:9092,CONTROLLER://:9093
    advertised.listeners=INTERNAL://${POD_NAME}.{{ include "kafka.fullname" . }}-headless:9092
    listener.security.protocol.map=INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
    inter.broker.listener.name=INTERNAL
    controller.quorum.voters={{ include "kafka.kraftVoters" . }}
    
    
    log.dirs=/bitnami/kafka/data
    num.network.threads=3
    num.io.threads=8
    socket.send.buffer.bytes=102400
    socket.receive.buffer.bytes=102400
    socket.request.max.bytes=104857600
    
    
    offsets.topic.replication.factor={{ include "kafka.replicationFactor" . }}
    transaction.state.log.replication.factor={{ include "kafka.replicationFactor" . }}
    transaction.state.log.min.isr=1
    min.insync.replicas=1
    
    
    auto.create.topics.enable=false
    
    
    log.retention.hours=168
    log.segment.bytes=1073741824
    log.retention.check.interval.ms=300000
    
    
    group.initial.rebalance.delay.ms=0
