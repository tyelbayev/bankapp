apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "kafka.fullname" . }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "kafka.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kafka.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "kafka.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ default (include "kafka.fullname" .) .Values.serviceAccount.name }}
      containers:
        - name: kafka
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_CFG_LOG_DIRS
              value: /bitnami/kafka/data
            - name: KAFKA_KRAFT_CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "kafka.fullname" . }}-cluster
                  key: cluster.id
            - name: BITNAMI_DEBUG
              value: "false"
            - name: KAFKA_HEAP_OPTS
              value: "{{ .Values.jvmOpts }}"
            - name: KAFKA_LOG_LEVEL
              value: "{{ .Values.logLevel }}"
          volumeMounts:
            - name: data
              mountPath: /bitnami/kafka
            - name: conf
              mountPath: /bitnami/kafka/config/server.properties
              subPath: server.properties
          ports:
            - name: internal
              containerPort: 9092
            - name: controller
              containerPort: 9093
          readinessProbe:
            {{- if .Values.readinessProbe.enabled }}
            tcpSocket:
              port: 9092
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
            {{- end }}
          livenessProbe:
            {{- if .Values.livenessProbe.enabled }}
            tcpSocket:
              port: 9092
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
            {{- end }}
          command:
            - bash
            - -ec
            - |
              set -euo pipefail
              # Ensure cluster id secret exists (one-per release)
              if ! kubectl get secret {{ include "kafka.fullname" . }}-cluster -n {{ .Release.Namespace }} >/dev/null 2>&1; then
                CID=$(kafka-storage.sh random-uuid)
                kubectl create secret generic {{ include "kafka.fullname" . }}-cluster \
                  -n {{ .Release.Namespace }} --from-literal=cluster.id="$CID"
              fi

              # Write config from configmap if not mounted
              if [ ! -f /bitnami/kafka/config/server.properties ]; then
                mkdir -p /bitnami/kafka/config
                cp /config/server.properties /bitnami/kafka/config/server.properties
              fi

              # Format storage once per broker if not already formatted
              if [ ! -f /bitnami/kafka/data/.formatted ]; then
                kafka-storage.sh format -t "$KAFKA_KRAFT_CLUSTER_ID" -c /bitnami/kafka/config/server.properties
                touch /bitnami/kafka/data/.formatted
              fi

              # Start Kafka
              exec /opt/bitnami/scripts/kafka/run.sh
      volumes:
        - name: conf
          configMap:
            name: {{ include "kafka.fullname" . }}-config
            items:
                - key: server.properties
                  path: server.properties
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
