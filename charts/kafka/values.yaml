image:
  repository: bitnami/kafka
  tag: 3.7.0-debian-12-r8
  pullPolicy: IfNotPresent


# Number of brokers (1 for resource-constrained envs, 2 default, up to 3)
replicaCount: 2


serviceAccount:
  create: true
  name: ""


podAnnotations: {}


resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 512Mi


persistence:
  enabled: true
  storageClass: ""
  size: 10Gi


service:
  type: ClusterIP
  port: 9092


listeners:
  internal:
    name: INTERNAL
    port: 9092


jvmOpts: "-Xms256m -Xmx512m"
logLevel: INFO
extraEnv: []


pdb:
  enabled: true
  minAvailable: 1

autoprovision:
  enabled: true
  image:
    repository: bitnami/kafka
    tag: 3.7.0-debian-12-r8
    pullPolicy: IfNotPresent
  backoffLimit: 6
  topics: []

livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 6


readinessProbe:
  enabled: true
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6


nodeSelector: {}
  tolerations: []
  affinity: {}
