server:
  port: 8080

spring:
  application:
    name: front-ui

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics,env,configprops"
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  observations:
    enable:
      all: true

management.tracing:
  enabled: true
  sampling:
    probability: 1.0
management.zipkin:
  tracing:
    endpoint: http://zipkin.dev.svc.cluster.local:9411/api/v2/spans

  thymeleaf:
    enabled: true
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: front-ui
            client-secret: ZKFJEMGVOJr3fX96tuh8mc6DcJJPCxCL
            scope: openid
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          front-ui-s2s:
            provider: keycloak
            client-id: front-ui-s2s
            client-secret: LRATVPSf2ibpxLacTSEQeciChTtB84c9
            authorization-grant-type: client_credentials
            scope: openid
        provider:
          keycloak:
            issuer-uri: http://localhost:8089/realms/bankapp
            authorization-uri: http://localhost:8089/realms/bankapp/protocol/openid-connect/auth
            token-uri: http://localhost:8089/realms/bankapp/protocol/openid-connect/token
            user-info-uri: http://localhost:8089/realms/bankapp/protocol/openid-connect/userinfo
            user-name-attribute: preferred_username

      resourceserver:
        jwt:
          issuer-uri: http://localhost:8089/realms/bankapp

  main:
    allow-bean-definition-overriding: true

gateway:
  base-url: http://localhost:8088

logging:
  level:
    org.springframework.web.reactive.function.client: DEBUG
    reactor.netty.http.client: DEBUG
    reactor.netty.transport: DEBUG
