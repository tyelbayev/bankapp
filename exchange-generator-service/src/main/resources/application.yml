spring:
  application:
    name: exchange-generator-service
  kafka:
    bootstrap-servers: PLAINTEXT://kafka.dev.svc.cluster.local:9092
    client-id: ${spring.application.name}
    properties:
      spring.kafka.observation-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics,env,configprops"
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  observations:
    enable:
      all: true

management.tracing:
  enabled: true
  sampling:
    probability: 1.0
management.zipkin:
  tracing:
    endpoint: http://zipkin.dev.svc.cluster.local:9411/api/v2/spans

  datasource:
    url: jdbc:postgresql://localhost:5432/bankdb
    username: bankuser
    password: bankpass
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: exchange_generator_schema

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: exchange_generator_schema
  security:
    oauth2:
      client:
        registration:
          keycloak-client-credentials:
            provider: keycloak
            client-id: exchange-generator-service
            client-secret: FDQZ1BAQqxtw1Pw1caf2RCWRW6z1YeOh
            authorization-grant-type: client_credentials
            scope: openid
        provider:
          keycloak:
            token-uri: http://localhost:8089/realms/bankapp/protocol/openid-connect/token

server:
  port: 8086
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
    hostname: exchange-generator-service

gateway:
  base-url: http://localhost:8088
