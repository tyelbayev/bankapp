server:
  port: 8081
spring:
  application:
    name: accounts-service
  kafka:
    bootstrap-servers: PLAINTEXT://kafka.dev.svc.cluster.local:9092
    client-id: ${spring.application.name}
    properties:
      # включает Micrometer Observation для продюсеров/консьюмеров
      spring.kafka.observation-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics,env,configprops"
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  observations:
    enable:
      all: true

management.tracing:
  enabled: true
  sampling:
    probability: 1.0
management.zipkin:
  tracing:
    endpoint: http://zipkin.dev.svc.cluster.local:9411/api/v2/spans

  datasource:
    url: jdbc:postgresql://localhost:5432/bankdb
    username: bankuser
    password: bankpass
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: accounts_schema

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: accounts_schema

  sql:
    init:
      mode: always

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8089/realms/bankapp
      client:
        registration:
          keycloak-client-credentials:
            provider: keycloak
            client-id: accounts-service
            client-secret: hh7djDEJH2DuZYaagbabbWRDzu7NubBN
            authorization-grant-type: client_credentials
            scope: openid
        provider:
          keycloak:
            token-uri: http://localhost:8089/realms/bankapp/protocol/openid-connect/token

  kafka:
    properties:
      enable.idempotence: true
    producer:
      acks: all
      retries: 10
      delivery-timeout-ms: 120000
      request-timeout-ms: 30000
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
    hostname: accounts-service

logging:
  level:
    root: INFO
    com.example: DEBUG          # твой пакет
    org.springframework.security: DEBUG
